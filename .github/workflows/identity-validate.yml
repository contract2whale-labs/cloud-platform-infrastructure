name: identity-validate
"on":
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      ROOT: terraform/environments/${{ matrix.environment }}/bootstrap/ci-identity
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate identity code without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ROOT" ]; then
            echo "이 환경의 ci-identity는 아직 준비되지 않았습니다."
            exit 0
          fi
          terraform -chdir="$ROOT" fmt -check -diff
          terraform -chdir="$ROOT" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="$ROOT" validate

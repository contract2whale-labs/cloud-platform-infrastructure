name: terraform-plan
'on':
  pull_request: null
permissions:
  contents: read
jobs:
  tf-pick-roots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: m
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python3 ci/deploy-select.py preview
  tf-plan:
    needs: tf-pick-roots
    if: needs.tf-pick-roots.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.tf-pick-roots.outputs.matrix) }}
    environment: infra-${{ matrix.root.env }}-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ROOT_PATH: ${{ matrix.root.path }}
      STATE_KEY: ${{ matrix.root.key }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EXPECTED_APPLY_ROLE_ARN: ${{ vars.EXPECTED_APPLY_ROLE_ARN }}
      TF_IN_AUTOMATION: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        allowed-account-ids: ${{ vars.ACCOUNT_ID }}
        mask-aws-account-id: true
    - name: Private PR preview plan
      run: |
        set -euo pipefail
        python3 ci/saved-plan.py preview
        cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/plan-comment.md"
    - name: PR에 안전한 검토 정보 게시
      run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/plan-comment.md"
  tf-plan-result:
    needs:
    - tf-pick-roots
    - tf-plan
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: 실제로 실행된 PR plan 판정
      env:
        PICK_RESULT: ${{ needs.tf-pick-roots.result }}
        PLAN_RESULT: ${{ needs.tf-plan.result }}
        MATRIX: ${{ needs.tf-pick-roots.outputs.matrix }}
      run: |
        set -euo pipefail
        # fork PR의 OIDC SKIP을 성공한 plan으로 표시하지 않습니다.
        if [ "$PICK_RESULT" != "success" ]; then
          echo "Root selection did not run successfully. A trusted same-repository PR plan is required."
          exit 1
        fi
        if [ "$MATRIX" = "[]" ]; then
          test "$PLAN_RESULT" = "skipped"
        else
          test "$PLAN_RESULT" = "success"
        fi

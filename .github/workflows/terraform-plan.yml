name: terraform-plan

on:
  pull_request:

permissions:
  contents: read

jobs:
  tf-pick-roots:
    # fork 에서 온 PR 은 OIDC 를 받을 수 없으므로 실행하지 않습니다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: m
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          # plan 원문을 PR 에 게시하므로 private 저장소에서만 실행합니다.
          test "$REPO_PRIVATE" = "true"
          git diff --name-only "$BASE_SHA"...HEAD > changed.txt
          # 디렉터리가 있는 등록 root 만 대상으로 삼습니다.
          for p in $(jq -r '.roots[].path' ci/roots.json); do
            if [ -d "$p" ]; then echo "$p"; fi
          done > existing.txt
          # 공통 module 이 바뀌면 존재하는 모든 root, 아니면 바뀐 root 만 고릅니다.
          matrix="$(jq -c --rawfile ch changed.txt --rawfile ex existing.txt '
            ($ch | split("\n")) as $f
            | ($ex | split("\n")) as $e
            | [ .roots[] | . as $r
                | select($e | index($r.path))
                | select(($f | any(startswith("terraform/modules/")))
                         or ($f | any(startswith($r.path + "/"))))
                | . + {key: (.path | sub("^terraform/environments/[^/]+/"; "") + "/terraform.tfstate")} ]' ci/roots.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  tf-plan:
    needs: tf-pick-roots
    if: needs.tf-pick-roots.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.tf-pick-roots.outputs.matrix) }}
    environment: infra-${{ matrix.root.env }}-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ROOT_PATH: ${{ matrix.root.path }}
      STATE_KEY: ${{ matrix.root.key }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 계정 확인
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID"

      - name: init
        working-directory: ${{ matrix.root.path }}
        run: |
          set -euo pipefail
          # 환경 변수 TF_VARS_JSON 에서 이 root 의 입력만 꺼내 terraform.tfvars.json 으로 만듭니다.
          if [ -z "$TF_VARS_JSON" ]; then TF_VARS_JSON='{}'; fi
          echo "$TF_VARS_JSON" | jq --arg k "${STATE_KEY%/terraform.tfstate}" '.[$k] // {}' > terraform.tfvars.json
          {
            echo "bucket              = \"$STATE_BUCKET\""
            echo "key                 = \"$STATE_KEY\""
            echo "region              = \"$AWS_REGION\""
            echo "encrypt             = true"
            echo "use_lockfile        = true"
            echo "allowed_account_ids = [\"$EXPECTED_ACCOUNT_ID\"]"
          } > backend.hcl
          terraform init -input=false -lockfile=readonly -backend-config=backend.hcl

      - name: plan
        working-directory: ${{ matrix.root.path }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m -out=change.tfplan
          terraform show -no-color change.tfplan > plan.txt

      - name: PR 에 plan 게시
        working-directory: ${{ matrix.root.path }}
        run: |
          set -euo pipefail
          {
            echo "### terraform plan: $ROOT_PATH"
            echo '~~~text'
            head -c 60000 plan.txt
            echo
            echo '~~~'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md

  # 필수 검사로 등록할 단일 결과 job 입니다. matrix job 이름은 매번 달라 필수 검사로 고를 수 없습니다.
  tf-plan-result:
    needs: [tf-pick-roots, tf-plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: tf-pick-roots/tf-plan 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "실패한 job 이 있습니다: $r"; exit 1 ;;
            esac
          done

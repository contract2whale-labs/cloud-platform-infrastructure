# .github/workflows/commerce-api-db-budget.yml — cloud-platform-infrastructure
# 연결 고갈: commerce-api 선언(base · overlays · contracts · tests)을 바꾸는 PR 에서 DB 연결 예산 검사를 돌립니다.
# GitHub OIDC 토큰 발급 권한은 없고, 현재 steps에는 AWS 인증·클러스터 작업이 없습니다. 예산은 렌더 결과와 contracts/<env>.env(서버에서 잰 max_connections)로 계산합니다.
# 앱 CI 가 GitHub App 토큰으로 여는 digest PR 에서도 바로 돕니다 — GITHUB_TOKEN 으로 만든 이벤트는 대개 실행을 만들지 않고, GitHub App 토큰 이벤트도 실제 repository/조직 승인 정책과 event/run을 확인합니다. 기본 토큰 이벤트는 일반적으로 후속 workflow를 만들지 않습니다.
# 필수 검사(Ruleset 의 required status check)로 지정해야 병합이 막힙니다. 지정하지 않으면 실패를 보여 주기만 합니다.
name: commerce-api-db-budget
on:
  pull_request:
    branches: [main]
    paths:
      - 'gitops/apps/commerce-api/**'
      - '.github/workflows/commerce-api-db-budget.yml'
permissions:
  contents: read
concurrency:
  group: commerce-api-db-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                        # 예: base 와의 차이(git diff origin/main...HEAD)를 계산하려고 전체 이력을 받음
          persist-credentials: false
      - name: Pin kustomize (release binary + checksums.txt)
        env:
          KUSTOMIZE_VERSION: '5.8.1'            # 예: scripts/toolchain/tool-versions 의 kustomize 와 같은 버전
        run: |
          BASE="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          FILE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$FILE" "$BASE/$FILE"   # 예: 릴리스 바이너리를 파일로 받음 (curl | sh 아님)
          curl -sSfL -o checksums.txt "$BASE/checksums.txt"
          grep " $FILE\$" checksums.txt | sha256sum -c -   # 예: 체크섬이 다르면 여기서 실패
          tar -xzf "$FILE" kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f "$FILE" checksums.txt kustomize
      - name: Pin yq (release binary + checksums)
        env:
          YQ_VERSION: 'v4.53.6'                 # 예: 과정 문서의 yq 기준 버전
        run: |
          BASE="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
          curl -sSfL -o yq_linux_amd64 "$BASE/yq_linux_amd64"
          curl -sSfL -o checksums "$BASE/checksums"
          curl -sSfL -o checksums_hashes_order "$BASE/checksums_hashes_order"
          COLUMN="$(grep -n '^SHA-256$' checksums_hashes_order | cut -d: -f1)"   # 예: checksums 파일의 몇 번째 해시가 SHA-256 인지
          echo "$(awk -v c="$COLUMN" '$1 == "yq_linux_amd64" { print $(c + 1) }' checksums)  yq_linux_amd64" | sha256sum -c -
          sudo install -m 0755 yq_linux_amd64 /usr/local/bin/yq
          rm -f yq_linux_amd64 checksums checksums_hashes_order
      - name: Unit tests of the budget check
        run: bash gitops/apps/commerce-api/tests/budget.test.sh
      - name: Budget check for the environments this PR changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD" -- gitops/apps/commerce-api)"
          printf 'changed:\n%s\n' "$CHANGED"
          ENVS=""
          for dir in gitops/apps/commerce-api/overlays/*/; do
            env="$(basename "$dir")"
            if printf '%s\n' "$CHANGED" | grep -qE "^gitops/apps/commerce-api/(base/|overlays/$env/|contracts/$env\.env$)"; then ENVS="$ENVS $env"; fi
          done
          if [ -z "$ENVS" ]; then echo "BUDGET_SKIP no environment declaration changed (only tests or this workflow)"; exit 0; fi
          RC=0
          for env in $ENVS; do bash gitops/apps/commerce-api/tests/check-db-connection-budget.sh "$env" || RC=1; done
          exit "$RC"

name: terraform-audit
'on':
  workflow_dispatch:
    inputs:
      root:
        description: 현재 main으로 조회할 등록 root; apply 없음
        required: true
        type: string
permissions:
  contents: read
jobs:
  tf-pick:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      key: ${{ steps.pick.outputs.key }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: pick
      env:
        INPUT_ROOT: ${{ inputs.root }}
      run: python3 ci/saved-plan.py pick
  tf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infra-${{ needs.tf-pick.outputs.env }}-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest_key: ${{ steps.plan.outputs.manifest_key }}
      manifest_version: ${{ steps.plan.outputs.manifest_version }}
      manifest_sha: ${{ steps.plan.outputs.manifest_sha }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    env:
      ROOT_PATH: ${{ inputs.root }}
      STATE_KEY: ${{ needs.tf-pick.outputs.key }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EXPECTED_APPLY_ROLE_ARN: ${{ vars.EXPECTED_APPLY_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      TF_IN_AUTOMATION: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        allowed-account-ids: ${{ vars.ACCOUNT_ID }}
        mask-aws-account-id: true
    - id: plan
      name: Private read-only audit plan
      run: python3 ci/saved-plan.py audit
    needs: tf-pick

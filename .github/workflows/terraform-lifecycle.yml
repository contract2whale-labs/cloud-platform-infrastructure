        fetch-depth: 0
        persist-credentials: false
    - name: Validate registered lifecycle target before AWS credentials
      run: python3 ci/terraform-lifecycle.py select
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - id: lifecycle
      name: Cumulative chapter up
      run: python3 -I ci/run-lifecycle.py up
    if: inputs.operation == 'up' && inputs.environment == 'dev'
    container:
      image: ${{ needs.settings.outputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:

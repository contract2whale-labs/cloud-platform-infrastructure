name: terraform-lifecycle
run-name: ${{ inputs.environment }} ${{ inputs.operation }} · completed ${{ inputs.completed_chapter }}
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: 완료한 장까지 누적 Down / 보존한 소스·입력으로 Up
        required: true
        type: choice
        options:
        - down
        - up
      environment:
        description: Account-isolated Dev / Prod. Unsupported source/adapters stop before credentials.
        required: true
        type: choice
        default: dev
        options:
        - dev
        - prod
      completed_chapter:
        description: 실제로 완료한 장. 미구현 단계가 포함되면 AWS 접근 전에 중단합니다.
        required: true
        type: string
        default: BU02
permissions:
  contents: read
  packages: read
concurrency:
  group: terraform-infra-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
      LIFECYCLE_ENVIRONMENT: ${{ inputs.environment }}
      COMPLETED_CHAPTER: ${{ inputs.completed_chapter }}
      LIFECYCLE_TOOLCHAIN_IMAGE: ${{ vars.LIFECYCLE_TOOLCHAIN_IMAGE }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: python3 ci/terraform-lifecycle.py settings
      id: selection
    outputs:
      plan_environment: ${{ steps.selection.outputs.plan_environment }}
      apply_environment: ${{ steps.selection.outputs.apply_environment }}
      destroy_environment: ${{ steps.selection.outputs.destroy_environment }}
      registry_sha256: ${{ steps.selection.outputs.registry_sha256 }}
      completed_chapter: ${{ steps.selection.outputs.completed_chapter }}
      root_count: ${{ steps.selection.outputs.root_count }}
      up_level_count: ${{ steps.selection.outputs.up_level_count }}
      toolchain_image: ${{ steps.selection.outputs.toolchain_image }}
      privileged_destroy: ${{ steps.selection.outputs.privileged_destroy }}
  checkpoint:
    needs:
    - settings
    - lifecycle-preview
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.settings.outputs.apply_environment }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      LIFECYCLE_ROOT_CONTRACTS: ${{ secrets.LIFECYCLE_ROOT_CONTRACTS || vars.LIFECYCLE_ROOT_CONTRACTS
        }}
      EKS_PROBE_IMAGE: ${{ vars.EKS_PROBE_IMAGE }}
      EKS_PAUSE_IMAGE: ${{ vars.EKS_PAUSE_IMAGE }}
      TF_IN_AUTOMATION: 'true'
      GH_TOKEN: ${{ github.token }}
      LIFECYCLE_ENVIRONMENT: ${{ inputs.environment }}
      COMPLETED_CHAPTER: ${{ inputs.completed_chapter }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Validate registered lifecycle target before AWS credentials
      run: python3 ci/terraform-lifecycle.py select
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - id: lifecycle
      name: Cumulative chapter start
      run: python3 -I ci/run-lifecycle.py start
    if: ${{ !cancelled() && needs.settings.result == 'success' && (inputs.operation == 'up' || needs.settings.outputs.privileged_destroy
      != 'true') && (inputs.environment == 'dev' || needs.lifecycle-preview.result == 'success') }}
    name: Checkpoint metadata only · ${{ inputs.environment }} ${{ inputs.completed_chapter }} · source
      ${{ needs.lifecycle-preview.outputs.snapshot_sha || github.sha }}
    container:
      image: ${{ needs.settings.outputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
  down-plan:
    needs:
    - settings
    - checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.settings.outputs.plan_environment }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      LIFECYCLE_ROOT_CONTRACTS: ${{ secrets.LIFECYCLE_ROOT_CONTRACTS || vars.LIFECYCLE_ROOT_CONTRACTS
        }}
      EKS_PROBE_IMAGE: ${{ vars.EKS_PROBE_IMAGE }}
      EKS_PAUSE_IMAGE: ${{ vars.EKS_PAUSE_IMAGE }}
      TF_IN_AUTOMATION: 'true'
      GH_TOKEN: ${{ github.token }}
      LIFECYCLE_ENVIRONMENT: ${{ inputs.environment }}
      COMPLETED_CHAPTER: ${{ inputs.completed_chapter }}
      EXPECTED_APPLY_ROLE_ARN: ${{ vars.EXPECTED_APPLY_ROLE_ARN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Validate registered lifecycle target before AWS credentials
      run: python3 ci/terraform-lifecycle.py select
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - id: lifecycle
      name: Cumulative chapter plan
      run: python3 -I ci/run-lifecycle.py plan
    if: inputs.operation == 'down' && needs.settings.outputs.privileged_destroy != 'true'
    outputs:
      bundle_key: ${{ steps.lifecycle.outputs.bundle_key }}
      bundle_version: ${{ steps.lifecycle.outputs.bundle_version }}
      bundle_sha: ${{ steps.lifecycle.outputs.bundle_sha }}
    container:
      image: ${{ needs.settings.outputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
  down-review:
    needs:
    - settings
    - down-plan
    if: inputs.operation == 'down' && needs.settings.outputs.privileged_destroy != 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.settings.outputs.destroy_environment }}
    permissions: {}
    steps:
    - name: Approve the exact private bundle
      run: echo "Required Environment approval received. Every applied binary must match the reviewed
        bundle; no replan is permitted after this gate."
  down-apply:
    needs:
    - settings
    - down-plan
    - down-review
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.settings.outputs.apply_environment }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      LIFECYCLE_ROOT_CONTRACTS: ${{ secrets.LIFECYCLE_ROOT_CONTRACTS || vars.LIFECYCLE_ROOT_CONTRACTS
        }}
      EKS_PROBE_IMAGE: ${{ vars.EKS_PROBE_IMAGE }}
      EKS_PAUSE_IMAGE: ${{ vars.EKS_PAUSE_IMAGE }}
      TF_IN_AUTOMATION: 'true'
      GH_TOKEN: ${{ github.token }}
      LIFECYCLE_ENVIRONMENT: ${{ inputs.environment }}
      COMPLETED_CHAPTER: ${{ inputs.completed_chapter }}
      BUNDLE_KEY: ${{ needs.down-plan.outputs.bundle_key }}
      BUNDLE_VERSION: ${{ needs.down-plan.outputs.bundle_version }}
      EXPECTED_BUNDLE_SHA: ${{ needs.down-plan.outputs.bundle_sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Validate registered lifecycle target before AWS credentials
      run: python3 ci/terraform-lifecycle.py select
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - id: lifecycle
      name: Cumulative chapter apply
      run: python3 -I ci/run-lifecycle.py apply
    if: inputs.operation == 'down' && needs.settings.outputs.privileged_destroy != 'true'
    container:
      image: ${{ needs.settings.outputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
  up:
    needs:
    - settings
    - checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.settings.outputs.apply_environment }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      LIFECYCLE_ROOT_CONTRACTS: ${{ secrets.LIFECYCLE_ROOT_CONTRACTS || vars.LIFECYCLE_ROOT_CONTRACTS
        }}
      EKS_PROBE_IMAGE: ${{ vars.EKS_PROBE_IMAGE }}
      EKS_PAUSE_IMAGE: ${{ vars.EKS_PAUSE_IMAGE }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER_SECRETKEY: ${{ secrets.ARGOCD_SERVER_SECRETKEY }}
      GITOPS_REPO_SSH_KEY: ${{ secrets.GITOPS_REPO_SSH_KEY }}
      TF_IN_AUTOMATION: 'true'
      GH_TOKEN: ${{ github.token }}
      LIFECYCLE_ENVIRONMENT: ${{ inputs.environment }}
      COMPLETED_CHAPTER: ${{ inputs.completed_chapter }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:

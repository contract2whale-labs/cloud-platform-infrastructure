name: terraform-lifecycle
run-name: BU02 VPC ${{ inputs.operation }} · ${{ inputs.source_sha }}
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Dev VPC와 NAT 삭제 또는 같은 구성 재생성
        type: choice
        required: true
        options: [down, up]
      source_sha:
        description: Down과 Up에 똑같이 넣을 main의 40자리 commit SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: terraform-infra-${{ github.repository_id }}
  cancel-in-progress: false
env:
  ROOT: terraform/environments/dev/network/vpc
  BUCKET: company-dev-tfstate-004161356469
  AWS_REGION: ap-northeast-2
  ACCOUNT: '004161356469'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  TF_DATA_DIR: /tmp/bu02-vpc-tfdata
  PRIVATE: /tmp/bu02-vpc-private
  SOURCE_SHA: ${{ inputs.source_sha }}
  OPERATION: ${{ inputs.operation }}
defaults:
  run:
    shell: bash
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.repository == 'contract2whale-labs/cloud-platform-infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-dev-plan
    permissions:
      contents: read
      id-token: write
    env:
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
    outputs:
      key: ${{ steps.plan.outputs.key }}
      version: ${{ steps.plan.outputs.version }}
      sha256: ${{ steps.plan.outputs.sha256 }}
      input_sha256: ${{ steps.plan.outputs.input_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: main 소스와 고정 범위 확인
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATION" == down || "$OPERATION" == up ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git ls-files --error-unmatch "$ROOT/.terraform.lock.hcl" >/dev/null
          test -z "$(find "$ROOT" -maxdepth 1 -type f \( -name '*.tfvars' -o -name '*.tfvars.json' \))"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '004161356469'
      - name: 비공개 saved plan 작성
        id: plan
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRIVATE"
          trap 'echo "::error::비공개 plan 단계 실패. 전체 Terraform 로그를 공개하지 마세요."' ERR
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT"
          test "$(aws s3api get-bucket-versioning --bucket "$BUCKET" --expected-bucket-owner "$ACCOUNT" --query Status --output text)" = Enabled
          aws s3api get-public-access-block --bucket "$BUCKET" --expected-bucket-owner "$ACCOUNT" > "$PRIVATE/block.json"
          jq -e '.PublicAccessBlockConfiguration | [.BlockPublicAcls,.IgnorePublicAcls,.BlockPublicPolicy,.RestrictPublicBuckets] | all(. == true)' "$PRIVATE/block.json" >/dev/null
          jq -ceS '.["network/vpc"] | select(type == "object")' <<< "$TF_VARS_JSON" > "$PRIVATE/inputs.json"
          test -s "$PRIVATE/inputs.json"
          terraform -chdir="$ROOT" init -input=false -no-color -lockfile=readonly \
            -backend-config="bucket=$BUCKET" -backend-config="key=network/vpc/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" \
            -backend-config='allowed_account_ids=["004161356469"]' \
            -backend-config="use_lockfile=true" > "$PRIVATE/init.log" 2>&1
          test "$(terraform -chdir="$ROOT" workspace show)" = default
          terraform -chdir="$ROOT" state pull > "$PRIVATE/state.json" 2> "$PRIVATE/state.log"
          # Down은 기존 VPC/NAT State가 필수이고, Up은 삭제 후 빈 AWS State만 받습니다.
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = Path(os.environ["PRIVATE"])
          allowed = set("aws_vpc aws_subnet aws_internet_gateway aws_eip aws_nat_gateway aws_route aws_route_table aws_route_table_association aws_default_route_table aws_default_security_group aws_default_network_acl aws_network_acl aws_network_acl_rule terraform_data".split())
          state = json.loads((p / "state.json").read_text())
          rs = [r for r in state.get("resources", []) if r.get("mode") == "managed" and r.get("instances")]
          assert all(r["type"] in allowed for r in rs), "VPC 외 State 자원: 중단"
          if os.environ["OPERATION"] == "down":
              vpcs = [i["attributes"]["id"] for r in rs if r["type"] == "aws_vpc" for i in r["instances"]]
              assert len(vpcs) == 1 and any(r["type"] == "aws_nat_gateway" for r in rs), "완료된 BU02 State 필요"
              raw = subprocess.check_output(["aws", "ec2", "describe-network-interfaces", "--filters", "Name=vpc-id,Values=" + vpcs[0]], stderr=subprocess.DEVNULL)
              enis = json.loads(raw)["NetworkInterfaces"]
              owned = {i["attributes"]["network_interface_id"] for r in rs if r["type"] == "aws_nat_gateway" for i in r["instances"]}
              assert all(x.get("InterfaceType") == "nat_gateway" for x in enis) and {x["NetworkInterfaceId"] for x in enis} == owned, "State 밖 ENI/NAT 의존성: 중단"
          else:
              assert not any(r["type"].startswith("aws_") for r in rs), "Up 전에 Down 완료 필요"
          PY
          args=()
          if [ "$OPERATION" = down ]; then args+=(-destroy); fi
          terraform -chdir="$ROOT" plan "${args[@]}" -input=false -no-color -lock-timeout=5m \
            -var-file="$PRIVATE/inputs.json" -out="$PRIVATE/saved.tfplan" > "$PRIVATE/plan.log" 2>&1
          terraform -chdir="$ROOT" show -json "$PRIVATE/saved.tfplan" > "$PRIVATE/plan.json" 2> "$PRIVATE/show.log"
          # 실제 plan의 자원 종류, 변경 방향, 유효 계정·환경 입력을 다시 제한합니다.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["PRIVATE"])
          plan = json.loads((p / "plan.json").read_text())
          allowed = set("aws_vpc aws_subnet aws_internet_gateway aws_eip aws_nat_gateway aws_route aws_route_table aws_route_table_association aws_default_route_table aws_default_security_group aws_default_network_acl aws_network_acl aws_network_acl_rule terraform_data".split())
          actions = {"delete", "no-op", "read"} if os.environ["OPERATION"] == "down" else {"create", "no-op", "read"}
          changes = [r for r in plan.get("resource_changes", []) if r.get("mode") == "managed"]
          assert changes and all(r["type"] in allowed and set(r["change"]["actions"]) <= actions for r in changes), "범위 밖 plan: 중단"
          for k, v in {"environment":"dev", "region":"ap-northeast-2", "expected_account_id":"004161356469", "state_bucket_name":os.environ["BUCKET"]}.items():
              if k in plan.get("variables", {}):
                  assert plan["variables"][k]["value"] == v, "대상 입력 불일치"
          PY
          KEY="bu02-vpc-lifecycle/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/saved.tfplan"
          VERSION="$(aws s3api put-object --bucket "$BUCKET" --key "$KEY" --body "$PRIVATE/saved.tfplan" --if-none-match '*' --expected-bucket-owner "$ACCOUNT" --query VersionId --output text)"
          test -n "$VERSION" && test "$VERSION" != None && test "$VERSION" != null
          SHA="$(sha256sum "$PRIVATE/saved.tfplan" | cut -d ' ' -f 1)"
          INPUT_SHA="$(sha256sum "$PRIVATE/inputs.json" | cut -d ' ' -f 1)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "input_sha256=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          # 공개 로그에는 검토용 식별자만 남깁니다. plan·State 본문은 출력하지 않습니다.
          {
            echo "operation=$OPERATION"
            echo "source_sha=$SOURCE_SHA"
            echo "key=$KEY"
            echo "version=$VERSION"
            echo "sha256=$SHA"
            echo "input_sha256=$INPUT_SHA"
            echo "이 S3 버전의 plan 전체를 비공개로 검토한 뒤 현재 run을 승인하세요."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 실패 로그를 비공개 S3에 보관
        if: failure()
        run: |
          set -euo pipefail
          test -d "$PRIVATE" || exit 0
          for f in "$PRIVATE"/*.log; do
            test -f "$f" || continue
            echo "== $(basename "$f")"
            cat "$f"
          done > "$PRIVATE/diagnostics.txt"
          test -s "$PRIVATE/diagnostics.txt" || exit 0
          KEY="bu02-vpc-lifecycle/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/diagnostics/plan.log"
          aws s3api put-object --bucket "$BUCKET" --key "$KEY" --body "$PRIVATE/diagnostics.txt" \
            --if-none-match '*' --expected-bucket-owner "$ACCOUNT" >/dev/null
          echo "비공개 실패 로그: s3://$BUCKET/$KEY"
      - name: 러너 임시 파일 정리
        if: always()
        run: rm -rf "$PRIVATE" "$TF_DATA_DIR"
  review:
    needs: plan
    runs-on: ubuntu-latest
    environment: infra-dev-destroy
    permissions: {}
    steps:
      - name: 이 run의 정확한 plan 검토 승인
        run: echo "비공개 saved plan 검토 후 Environment 승인이 완료되었습니다."
  apply:
    needs: [plan, review]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: infra-dev-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      PLAN_KEY: ${{ needs.plan.outputs.key }}
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      PLAN_SHA: ${{ needs.plan.outputs.sha256 }}
      INPUT_SHA: ${{ needs.plan.outputs.input_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '004161356469'
      - name: 승인한 S3 버전만 적용
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRIVATE"
          trap 'echo "::error::적용 중단. State와 실제 AWS 상태를 먼저 확인하세요. 강제 삭제하지 마세요."' ERR
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT"
          test "$PLAN_KEY" = "bu02-vpc-lifecycle/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/saved.tfplan"
          jq -ceS '.["network/vpc"] | select(type == "object")' <<< "$TF_VARS_JSON" > "$PRIVATE/inputs.json"
          test "$(sha256sum "$PRIVATE/inputs.json" | cut -d ' ' -f 1)" = "$INPUT_SHA"
          aws s3api get-object --bucket "$BUCKET" --key "$PLAN_KEY" --version-id "$PLAN_VERSION" \
            --expected-bucket-owner "$ACCOUNT" "$PRIVATE/saved.tfplan" > "$PRIVATE/download.json"
          test "$(sha256sum "$PRIVATE/saved.tfplan" | cut -d ' ' -f 1)" = "$PLAN_SHA"
          terraform -chdir="$ROOT" init -input=false -no-color -lockfile=readonly \
            -backend-config="bucket=$BUCKET" -backend-config="key=network/vpc/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" \
            -backend-config='allowed_account_ids=["004161356469"]' \
            -backend-config="use_lockfile=true" > "$PRIVATE/init.log" 2>&1
          test "$(terraform -chdir="$ROOT" workspace show)" = default
          # 재계획하지 않습니다. Terraform은 잠금을 잡고 오래된 saved plan도 거부합니다.
          terraform -chdir="$ROOT" apply -input=false -no-color -lock-timeout=5m \
            "$PRIVATE/saved.tfplan" > "$PRIVATE/apply.log" 2>&1
          terraform -chdir="$ROOT" state pull > "$PRIVATE/after.json" 2> "$PRIVATE/state.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ["PRIVATE"]) / "after.json").read_text())
          rs = [r for r in state.get("resources", []) if r.get("mode") == "managed" and r.get("instances")]
          if os.environ["OPERATION"] == "down":
              assert not rs, "State 잔여 자원 확인 필요"
          else:
              assert sum(len(r["instances"]) for r in rs if r["type"] == "aws_vpc") == 1
              assert any(r["type"] == "aws_nat_gateway" for r in rs)
          PY
          echo "BU02 VPC $OPERATION 적용과 State 확인 완료."
      - name: 실패 로그를 비공개 S3에 보관
        if: failure()
        run: |
          set -euo pipefail
          test -d "$PRIVATE" || exit 0
          for f in "$PRIVATE"/*.log; do
            test -f "$f" || continue
            echo "== $(basename "$f")"
            cat "$f"
          done > "$PRIVATE/diagnostics.txt"
          test -s "$PRIVATE/diagnostics.txt" || exit 0
          KEY="bu02-vpc-lifecycle/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/diagnostics/apply.log"
          aws s3api put-object --bucket "$BUCKET" --key "$KEY" --body "$PRIVATE/diagnostics.txt" \
            --if-none-match '*' --expected-bucket-owner "$ACCOUNT" >/dev/null
          echo "비공개 실패 로그: s3://$BUCKET/$KEY"
      - name: 러너 임시 파일 정리
        if: always()
        run: rm -rf "$PRIVATE" "$TF_DATA_DIR"

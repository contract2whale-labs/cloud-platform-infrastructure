  prod-up-01:
    needs:
    - settings
    - checkpoint
    if: ${{ !cancelled() && inputs.environment == 'prod' && inputs.operation == 'up' && needs.settings.result
      == 'success' && needs.checkpoint.result == 'success' && fromJSON(needs.settings.outputs.up_level_count)
      >= 1 }}

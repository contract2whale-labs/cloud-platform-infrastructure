name: identity-admin
permissions:
  contents: read
concurrency:
  group: terraform-identity-${{ github.repository_id }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  tf-saved-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: identity-${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest_key: ${{ steps.plan.outputs.manifest_key }}
      manifest_version: ${{ steps.plan.outputs.manifest_version }}
      manifest_sha: ${{ steps.plan.outputs.manifest_sha }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
    env:
      ROOT_PATH: terraform/environments/${{ inputs.environment }}/bootstrap/ci-identity
      STATE_KEY: bootstrap/ci-identity/terraform.tfstate
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EXPECTED_APPLY_ROLE_ARN: ${{ vars.EXPECTED_APPLY_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      TF_IN_AUTOMATION: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check identity target before credentials
      env:
        IDENTITY_MODE: plan
      run: python3 -c 'import runpy, os; m = runpy.run_path("ci/identity-admin.py");
        m["guard"](os.environ["IDENTITY_MODE"])'
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        allowed-account-ids: ${{ vars.ACCOUNT_ID }}
        mask-aws-account-id: true
    - id: plan
      name: Private saved plan
      run: python3 ci/identity-admin.py plan
    if: github.ref == 'refs/heads/main' && (inputs.environment == 'dev' || inputs.environment
      == 'prod')
  tf-apply:
    needs: tf-saved-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: identity-${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
    env:
      ROOT_PATH: terraform/environments/${{ inputs.environment }}/bootstrap/ci-identity
      STATE_KEY: bootstrap/ci-identity/terraform.tfstate
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON || vars.TF_VARS_JSON }}
      TF_IN_AUTOMATION: 'true'
      MANIFEST_KEY: ${{ needs.tf-saved-plan.outputs.manifest_key }}
      MANIFEST_VERSION: ${{ needs.tf-saved-plan.outputs.manifest_version }}
      EXPECTED_MANIFEST_SHA: ${{ needs.tf-saved-plan.outputs.manifest_sha }}
      EXPECTED_PLAN_SHA: ${{ needs.tf-saved-plan.outputs.plan_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check identity target before credentials
      env:
        IDENTITY_MODE: apply
      run: python3 -c 'import runpy, os; m = runpy.run_path("ci/identity-admin.py");
        m["guard"](os.environ["IDENTITY_MODE"])'
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        allowed-account-ids: ${{ vars.ACCOUNT_ID }}
        mask-aws-account-id: true
    - name: Apply approved identity plan unchanged
      run: python3 ci/identity-admin.py apply
    if: github.ref == 'refs/heads/main' && (inputs.environment == 'dev' || inputs.environment
      == 'prod')
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Account to administer
        required: true
        type: choice
        options:
        - dev
        - prod

name: terraform-validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  tf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Mandatory: fake-only credentials, no id-token permission or AWS account.
      - name: required credentialless OIDC refresh tests
        timeout-minutes: 15
        run: bash ci/oidc-tests/run_required.sh

      - name: fmt
        run: |
          set -euo pipefail
          for p in terraform modules; do
            if [ ! -d "$p" ]; then continue; fi
            terraform fmt -check -recursive "$p"
          done

      - name: init(backend 없이) / validate / test
        run: |
          set -euo pipefail
          for p in $(jq -r '.roots[].path' ci/roots.json); do
            # 아직 만들지 않은 root 는 건너뜁니다.
            if [ ! -d "$p" ]; then continue; fi
            echo "== $p"
            terraform -chdir="$p" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$p" validate
            if [ -d "$p/tests" ]; then
              terraform -chdir="$p" test
            fi
          done

      - name: shared module mock tests
        run: |
          set -euo pipefail
          for p in modules/*; do
            if [ ! -d "$p/tests" ]; then continue; fi
            # 테스트와 Terraform 소스가 함께 있는 모듈만 검사합니다.
            if ! compgen -G "$p/*.tf" > /dev/null && ! compgen -G "$p/*.tf.json" > /dev/null; then
              continue
            fi
            echo "== $p"
            # 모듈 lock은 ci/prepare-module-locks.sh로 준비하고 커밋합니다.
            if [ ! -f "$p/.terraform.lock.hcl" ]; then
              echo "Missing module lock: $p/.terraform.lock.hcl; run bash ci/prepare-module-locks.sh" >&2
              exit 1
            fi
            terraform -chdir="$p" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$p" test
          done

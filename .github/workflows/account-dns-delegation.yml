name: account-dns-delegation

on:
  pull_request:
    paths:
      - .github/workflows/account-dns-delegation.yml
      - ci/account_dns_delegation.py
      - ci/tests/test_account_dns_delegation.py
  workflow_dispatch:
    inputs:
      parent_zone_id:
        description: 'Network 계정의 공개 부모 Zone ID'
        required: true
        type: string
      delegations_json:
        description: '실제 Dev/Prod 자식 Zone에서 조회한 NS 레코드 두 개의 JSON 배열'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: account-dns-delegation-${{ inputs.parent_zone_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AWS 없는 위임 입력 검사
        run: |
          # 문법과 정상·거부 입력을 검사하며 AWS에는 연결하지 않습니다.
          python3 -m py_compile ci/account_dns_delegation.py
          python3 -m unittest discover -s ci/tests -p test_account_dns_delegation.py -v
  review:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: infra-network-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
    env:
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      PARENT_ZONE_ID: ${{ inputs.parent_zone_id }}
      DELEGATIONS_JSON: ${{ inputs.delegations_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 병합된 최신 main 확인
        run: |
          # 임의 branch와 오래된 main에서는 부모 DNS를 변경하지 않습니다.
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 기존 NS와 변경값 검토 자료 만들기
        id: plan
        run: |
          # 읽기 역할로 두 NS만 대조하고 변경·복구 파일을 저장합니다.
          python3 ci/account_dns_delegation.py plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: dns-review/
          retention-days: 1
  apply:
    needs: review
    runs-on: ubuntu-latest
    # 반드시 Required reviewers를 설정합니다. Dev 자동 Terraform 적용과 별도 승인입니다.
    environment: infra-network-apply
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      EXPECTED_PLAN_SHA: ${{ needs.review.outputs.plan_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dns-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: dns-review/
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 승인한 NS 두 건 반영과 재조회
        run: |
          # 동일 plan 해시·계정·SHA와 현재 레코드를 다시 대조한 뒤 두 NS만 반영합니다.
          python3 ci/account_dns_delegation.py apply

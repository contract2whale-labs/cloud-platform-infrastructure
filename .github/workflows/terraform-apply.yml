name: terraform-apply
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      root:
        description: 예외 재시도할 등록 root (일반 수업은 PR 병합으로 자동 실행)
        required: true
        type: string
concurrency:
  group: terraform-infra-${{ github.repository_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tf-pick:
    runs-on: ubuntu-latest
    outputs:
      has_roots: ${{ steps.pick.outputs.has_roots }}
      dev_wave_0: ${{ steps.pick.outputs.dev_wave_0 }}
      dev_wave_1: ${{ steps.pick.outputs.dev_wave_1 }}
      dev_wave_2: ${{ steps.pick.outputs.dev_wave_2 }}
      dev_wave_3: ${{ steps.pick.outputs.dev_wave_3 }}
      dev_wave_4: ${{ steps.pick.outputs.dev_wave_4 }}
      dev_wave_5: ${{ steps.pick.outputs.dev_wave_5 }}
      dev_wave_6: ${{ steps.pick.outputs.dev_wave_6 }}
      dev_wave_7: ${{ steps.pick.outputs.dev_wave_7 }}
      dev_wave_8: ${{ steps.pick.outputs.dev_wave_8 }}
      dev_wave_9: ${{ steps.pick.outputs.dev_wave_9 }}
      dev_wave_10: ${{ steps.pick.outputs.dev_wave_10 }}
      dev_wave_11: ${{ steps.pick.outputs.dev_wave_11 }}
      prod_wave_0: ${{ steps.pick.outputs.prod_wave_0 }}
      prod_wave_1: ${{ steps.pick.outputs.prod_wave_1 }}
      prod_wave_2: ${{ steps.pick.outputs.prod_wave_2 }}
      prod_wave_3: ${{ steps.pick.outputs.prod_wave_3 }}
      prod_wave_4: ${{ steps.pick.outputs.prod_wave_4 }}
      prod_wave_5: ${{ steps.pick.outputs.prod_wave_5 }}
      prod_wave_6: ${{ steps.pick.outputs.prod_wave_6 }}
      prod_wave_7: ${{ steps.pick.outputs.prod_wave_7 }}
      prod_wave_8: ${{ steps.pick.outputs.prod_wave_8 }}
      prod_wave_9: ${{ steps.pick.outputs.prod_wave_9 }}
      prod_wave_10: ${{ steps.pick.outputs.prod_wave_10 }}
      prod_wave_11: ${{ steps.pick.outputs.prod_wave_11 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: pick
      env:
        INPUT_ROOT: ${{ inputs.root }}
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/deploy-select.py
    permissions:
      contents: read
      actions: read
  tf-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false
    - name: fmt
      run: |
        set -euo pipefail
        for p in terraform modules; do
          if [ ! -d "$p" ]; then continue; fi
          terraform fmt -check -recursive "$p"
        done
    - name: init(backend 없이) / validate / test
      run: |
        set -euo pipefail
        for p in $(jq -r '.roots[].path' ci/roots.json); do
          # 아직 만들지 않은 root 는 건너뜁니다.
          if [ ! -d "$p" ]; then continue; fi
          echo "== $p"
          terraform -chdir="$p" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="$p" validate
          if [ -d "$p/tests" ]; then
            terraform -chdir="$p" test
          fi
        done
    - name: shared module mock tests
      run: |
        set -euo pipefail
        for p in modules/*; do
          if [ ! -d "$p/tests" ]; then continue; fi
          # 테스트와 Terraform 소스가 함께 있는 모듈만 검사합니다.
          if ! compgen -G "$p/*.tf" > /dev/null && ! compgen -G "$p/*.tf.json" > /dev/null; then
            continue
          fi
          echo "== $p"
          # 모듈 lock은 ci/prepare-module-locks.sh로 준비하고 커밋합니다.
          if [ ! -f "$p/.terraform.lock.hcl" ]; then
            echo "Missing module lock: $p/.terraform.lock.hcl; run bash ci/prepare-module-locks.sh" >&2
            exit 1
          fi
          terraform -chdir="$p" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="$p" test
        done
    needs: tf-pick
    if: needs.tf-pick.outputs.has_roots == 'true'
  deploy-dev-wave-0:
    needs:
    - tf-pick
    - tf-validate
    if: always() && needs.tf-pick.result == 'success' && needs.tf-validate.result
      == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result,
      'cancelled') && needs.tf-pick.outputs.dev_wave_0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.tf-pick.outputs.dev_wave_0) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-deploy-root.yml
    with:
      root: ${{ matrix.root.path }}
      environment: ${{ matrix.root.env }}
      state_key: ${{ matrix.root.key }}
    secrets: inherit
  deploy-dev-wave-1:

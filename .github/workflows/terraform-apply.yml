name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      root:
        description: 'ci/roots.json 에 등록된 root 경로'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tf-pick:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.r.outputs.env }}
      key: ${{ steps.r.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: r
        env:
          INPUT_ROOT: ${{ inputs.root }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          # plan 을 run 요약에 남기므로 private 저장소에서만 실행합니다.
          test "$REPO_PRIVATE" = "true"
          # main 의 최신 commit 만 적용합니다.
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          # 등록된 root 만 허용합니다.
          row="$(jq -c --arg p "$INPUT_ROOT" '.roots[] | select(.path == $p)' ci/roots.json)"
          test -n "$row"
          test -d "$INPUT_ROOT"
          echo "env=$(echo "$row" | jq -r .env)" >> "$GITHUB_OUTPUT"
          echo "key=$(echo "$INPUT_ROOT" | sed -E 's#^terraform/environments/[^/]+/##')/terraform.tfstate" >> "$GITHUB_OUTPUT"

  tf-saved-plan:
    needs: tf-pick
    runs-on: ubuntu-latest
    environment: infra-${{ needs.tf-pick.outputs.env }}-plan
    permissions:
      contents: read
      id-token: write
    env:
      ROOT_PATH: ${{ inputs.root }}
      STATE_KEY: ${{ needs.tf-pick.outputs.key }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 계정 확인
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID"

      - name: init / plan 저장
        working-directory: ${{ inputs.root }}
        run: |
          set -euo pipefail
          # 환경 변수 TF_VARS_JSON 에서 이 root 의 입력만 꺼내 terraform.tfvars.json 으로 만듭니다.
          if [ -z "$TF_VARS_JSON" ]; then TF_VARS_JSON='{}'; fi
          echo "$TF_VARS_JSON" | jq --arg k "${STATE_KEY%/terraform.tfstate}" '.[$k] // {}' > terraform.tfvars.json
          {
            echo "bucket              = \"$STATE_BUCKET\""
            echo "key                 = \"$STATE_KEY\""
            echo "region              = \"$AWS_REGION\""
            echo "encrypt             = true"
            echo "use_lockfile        = true"
            echo "allowed_account_ids = [\"$EXPECTED_ACCOUNT_ID\"]"
          } > backend.hcl
          terraform init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform plan -input=false -lock-timeout=5m -out=change.tfplan
          terraform show -no-color change.tfplan > plan.txt
          sha256sum change.tfplan > change.tfplan.sha256
          # 승인자가 읽을 plan 을 run 요약에 남깁니다.
          {
            echo "### terraform plan: $ROOT_PATH"
            echo '~~~text'
            head -c 60000 plan.txt
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ inputs.root }}/change.tfplan
            ${{ inputs.root }}/change.tfplan.sha256
          retention-days: 1

  tf-apply:
    needs: [tf-pick, tf-saved-plan]
    runs-on: ubuntu-latest
    # 이 Environment 에 Required reviewers 를 설정하면 승인 전까지 이 job 은 시작하지 않습니다.
    environment: infra-${{ needs.tf-pick.outputs.env }}-apply
    concurrency:
      group: tf-${{ needs.tf-pick.outputs.env }}-${{ needs.tf-pick.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ROOT_PATH: ${{ inputs.root }}
      STATE_KEY: ${{ needs.tf-pick.outputs.key }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 계정 확인
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.root }}

      - name: init / apply
        working-directory: ${{ inputs.root }}
        run: |
          set -euo pipefail
          sha256sum -c change.tfplan.sha256
          {
            echo "bucket              = \"$STATE_BUCKET\""
            echo "key                 = \"$STATE_KEY\""
            echo "region              = \"$AWS_REGION\""
            echo "encrypt             = true"
            echo "use_lockfile        = true"
            echo "allowed_account_ids = [\"$EXPECTED_ACCOUNT_ID\"]"
          } > backend.hcl
          terraform init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform apply -input=false change.tfplan
          terraform output
